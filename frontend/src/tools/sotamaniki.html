<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Robot Pose Viewer</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "mannequin": "https://cdn.jsdelivr.net/npm/mannequin-js@latest/src/mannequin.js"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #222;
      font-family: Arial, sans-serif;
    }

    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 280px;
      padding: 12px;
      background: rgba(20, 20, 20, .92);
      color: white;
      border-radius: 8px;
      z-index: 10;
      font-size: 12px;
      max-height: 95vh;
      overflow-y: auto;
    }

    #controls h3,
    #endpoints h3,
    #servos h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .section {
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #aaa;
    }

    .control {
      display: grid;
      grid-template-columns: 80px 1fr 65px;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
    }

    .control label {
      font-family: monospace;
      font-size: 11px;
      color: #29b6f6;
    }

    .control input[type="range"] {
      width: 100%;
    }

    .number {
      width: 55px;
      box-sizing: border-box;
      padding: 3px 4px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #333;
      color: white;
      font: 11px monospace;
      text-align: right;
    }

    .number:focus {
      outline: 1px solid #888;
    }

    #sidebar-right {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 330px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    #endpoints, #servos {
      padding: 12px;
      background: rgba(20, 20, 20, .92);
      color: white;
      border-radius: 8px;
      font: 11px monospace;
    }

    .endpoint, .servo-item {
      margin-bottom: 10px;
    }

    .endpoint-title {
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .endpoint-row, .servo-row {
      margin: 2px 0;
    }

    .label {
      color: #999;
    }

    .servo-id {
      color: #4fc3f7;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="controls">

  <h3>Robot Pose Controls</h3>

  <div class="section">Body</div>

  <div class="control" data-servo-id="body_yaw">
    <label>body_yaw</label>
    <input id="turnSlider" type="range" min="-180" max="180" step="0.1" data-servo-id="body_yaw">
    <input id="turn" class="number" type="number" step="0.1" data-servo-id="body_yaw">
  </div>

  <div class="section">Left Arm</div>

  <div class="control" data-servo-id="left_shoulder">
    <label>left_shoulder</label>
    <input id="leftShoulderSlider" type="range" min="-180" max="180" step="0.1" data-servo-id="left_shoulder">
    <input id="leftShoulder" class="number" type="number" step="0.1" data-servo-id="left_shoulder">
  </div>

  <div class="control" data-servo-id="left_elbow">
    <label>left_elbow</label>
    <input id="leftElbowSlider" type="range" min="-180" max="180" step="0.1" data-servo-id="left_elbow">
    <input id="leftElbow" class="number" type="number" step="0.1" data-servo-id="left_elbow">
  </div>

  <div class="section">Right Arm</div>

  <div class="control" data-servo-id="right_shoulder">
    <label>right_shoulder</label>
    <input id="rightShoulderSlider" type="range" min="-180" max="180" step="0.1" data-servo-id="right_shoulder">
    <input id="rightShoulder" class="number" type="number" step="0.1" data-servo-id="right_shoulder">
  </div>

  <div class="control" data-servo-id="right_elbow">
    <label>right_elbow</label>
    <input id="rightElbowSlider" type="range" min="-180" max="180" step="0.1" data-servo-id="right_elbow">
    <input id="rightElbow" class="number" type="number" step="0.1" data-servo-id="right_elbow">
  </div>

  <div class="section">Head</div>

  <div class="control" data-servo-id="head_yaw">
    <label>head_yaw</label>
    <input id="headTurnSlider" type="range" min="-180" max="180" step="0.1" data-servo-id="head_yaw">
    <input id="headTurn" class="number" type="number" step="0.1" data-servo-id="head_yaw">
  </div>

  <div class="control" data-servo-id="head_pitch">
    <label>head_pitch</label>
    <input id="headNodSlider" type="range" min="-180" max="180" step="0.1" data-servo-id="head_pitch">
    <input id="headNod" class="number" type="number" step="0.1" data-servo-id="head_pitch">
  </div>

  <div class="control" data-servo-id="head_roll">
    <label>head_roll</label>
    <input id="headTiltSlider" type="range" min="-180" max="180" step="0.1" data-servo-id="head_roll">
    <input id="headTilt" class="number" type="number" step="0.1" data-servo-id="head_roll">
  </div>

</div>

<div id="sidebar-right">

  <div id="servos">
    <h3>SOTA Servos</h3>
    <div id="servoList"></div>
  </div>

  <div id="endpoints">

    <h3>SOTA Endpoints</h3>

    <div class="endpoint">
      <div class="endpoint-title">LEFT HAND</div>
      <div class="endpoint-row"><span class="label">Position:</span> <span id="leftHandPosition"></span></div>
      <div class="endpoint-row"><span class="label">Direction:</span> <span id="leftHandDirection"></span></div>
      <div class="endpoint-row"><span class="label">YPR:</span> <span id="leftHandYPR"></span></div>
    </div>

    <div class="endpoint">
      <div class="endpoint-title">RIGHT HAND</div>
      <div class="endpoint-row"><span class="label">Position:</span> <span id="rightHandPosition"></span></div>
      <div class="endpoint-row"><span class="label">Direction:</span> <span id="rightHandDirection"></span></div>
      <div class="endpoint-row"><span class="label">YPR:</span> <span id="rightHandYPR"></span></div>
    </div>

    <div class="endpoint">
      <div class="endpoint-title">HEAD</div>
      <div class="endpoint-row"><span class="label">Position:</span> <span id="headPosition"></span></div>
      <div class="endpoint-row"><span class="label">Direction:</span> <span id="headDirection"></span></div>
      <div class="endpoint-row"><span class="label">YPR:</span> <span id="headYPR"></span></div>
    </div>

  </div>

</div>

<script type="module">

import { createStage, Male } from "mannequin";

createStage();

const man = new Male();


// =============================================================
// CALIBRATION
// =============================================================

const CAL = {
  L_SHOULDER_ZERO: -79.14770376525507,
  L_ELBOW_ZERO: 4.115834859667839,
  R_SHOULDER_ZERO: 102.39583333366603,
  R_ELBOW_ZERO: 9.7262773844645
};


// =============================================================
// SOTA → MANNEQUIN
// =============================================================

function toMannequinDeg(servoStatus) {

  const g = id => {
    const found = servoStatus.find(s => s.servo_id === id);
    return found ? found.degrees : 0;
  };

  return {

    turn: g("body_yaw"),

    headTurn: g("head_yaw"),
    headNod: g("head_pitch"),
    headTilt: g("head_roll"),

    leftShoulder:
      g("left_shoulder") -
      CAL.L_SHOULDER_ZERO,

    leftElbow:
      CAL.L_ELBOW_ZERO -
      g("left_elbow"),

    rightShoulder:
      CAL.R_SHOULDER_ZERO -
      g("right_shoulder"),

    rightElbow:
      g("right_elbow") -
      CAL.R_ELBOW_ZERO
  };
}


// =============================================================
// UPDATE MANNEQUIN
// =============================================================

function updateMan() {

  man.turn =
    Number(document.getElementById("turn").value);

  man.l_arm.raise =
    Number(document.getElementById("leftShoulder").value);

  man.l_elbow.bend =
    Number(document.getElementById("leftElbow").value);

  man.r_arm.raise =
    Number(document.getElementById("rightShoulder").value);

  man.r_elbow.bend =
    Number(document.getElementById("rightElbow").value);

  man.head.turn =
    Number(document.getElementById("headTurn").value);

  man.head.nod =
    Number(document.getElementById("headNod").value);

  man.head.tilt =
    Number(document.getElementById("headTilt").value);
}


// =============================================================
// SET VALUE
// =============================================================

function setValue(id, value) {

  document.getElementById(id).value =
    Number(value).toFixed(2);

  document.getElementById(
    id + "Slider"
  ).value = value;
}


// =============================================================
// CONNECT SLIDER + NUMBER INPUT
// =============================================================

const controls = [

  "turn",

  "leftShoulder",
  "leftElbow",

  "rightShoulder",
  "rightElbow",

  "headTurn",
  "headNod",
  "headTilt"
];


controls.forEach(id => {

  const number =
    document.getElementById(id);

  const slider =
    document.getElementById(id + "Slider");


  slider.addEventListener("input", () => {

    number.value =
      Number(slider.value).toFixed(2);

    updateMan();
  });


  number.addEventListener("input", () => {

    const value =
      Number(number.value);

    if (Number.isFinite(value)) {

      slider.value =
        Math.max(
          Number(slider.min),
          Math.min(
            Number(slider.max),
            value
          )
        );

      updateMan();
    }
  });

});


// =============================================================
// SERVO STATUS DISPLAY
// =============================================================

function showServos(servoStatus) {

  const container = document.getElementById("servoList");
  container.innerHTML = "";

  servoStatus.forEach(s => {

    const item = document.createElement("div");
    item.className = "servo-item";

    const radStr = s.radians !== undefined ? `${Number(s.radians).toFixed(3)} rad` : '';

    item.innerHTML = `
      <div class="servo-row">
        <span class="servo-id">${s.servo_id}</span>
      </div>
      <div class="servo-row">
        <span class="label">deg:</span> ${Number(s.degrees).toFixed(2)}° 
        <span class="label" style="margin-left: 8px;">${radStr}</span>
      </div>
    `;

    container.appendChild(item);
  });
}


// =============================================================
// APPLY SOTA POSE
// =============================================================

function applyPose(servoStatus) {

  showServos(servoStatus);

  const m =
    toMannequinDeg(servoStatus);


  setValue("turn", m.turn);

  setValue(
    "leftShoulder",
    m.leftShoulder
  );

  setValue(
    "leftElbow",
    m.leftElbow
  );

  setValue(
    "rightShoulder",
    m.rightShoulder
  );

  setValue(
    "rightElbow",
    m.rightElbow
  );

  setValue(
    "headTurn",
    m.headTurn
  );

  setValue(
    "headNod",
    m.headNod
  );

  setValue(
    "headTilt",
    m.headTilt
  );


  updateMan();
}


// =============================================================
// ENDPOINT DISPLAY
// =============================================================

function formatVector(vector) {

  return vector
    .map(v => Number(v).toFixed(2))
    .join(", ");
}


function showEndpoints(endpointStatus) {

  for (const e of endpointStatus) {

    let prefix;

    if (e.endpoint_id === "leftHand")
      prefix = "leftHand";

    else if (e.endpoint_id === "rightHand")
      prefix = "rightHand";

    else if (e.endpoint_id === "head")
      prefix = "head";

    else
      continue;


    document.getElementById(
      prefix + "Position"
    ).textContent =
      formatVector(e.position);


    document.getElementById(
      prefix + "Direction"
    ).textContent =
      formatVector(e.pointDirection);


    document.getElementById(
      prefix + "YPR"
    ).textContent =
      formatVector(e.ypr);
  }
}


// =============================================================
// CURRENT SOTA POSE
// =============================================================

const servoStatus = [

  {
    servo_id: "body_yaw",
    radians: -0.8962808522491705,
    degrees: -51.353110092265986
  },

  {
    servo_id: "head_yaw",
    radians: 0.09234546308641978,
    degrees: 5.29100529203299
  },

  {
    servo_id: "head_roll",
    radians: -0.3682600084143224,
    degrees: -21.099744245592856
  },

  {
    servo_id: "right_elbow",
    radians: 1.7020145114452558,
    degrees: 97.5182481758339
  },

  {
    servo_id: "left_shoulder",
    radians: 0.205439045177493,
    degrees: 11.770790235867798
  },

  {
    servo_id: "head_pitch",
    radians: -0.08763159425941436,
    degrees: -5.020920503067296
  },

  {
    servo_id: "left_elbow",
    radians: -1.6996259290178684,
    degrees: -97.38139248372549
  },

  {
    servo_id: "right_shoulder",
    radians: -0.2617993877999998,
    degrees: -15.000000000048722
  }

];


// =============================================================
// CURRENT SOTA ENDPOINTS
// =============================================================

const endpointStatus = [

  {
    endpoint_id: "leftHand",

    position: [
      -2.575019142110871,
      -3.925923625827058,
      9.332022767056907
    ],

    pointDirection: [
      -35.05191958020563,
      1.1471780080137801,
      20.284232580174166
    ],

    ypr: [
      -112.07524617168549,
      -20.269030982397926,
      -28.19721777112108
    ]
  },

  {
    endpoint_id: "rightHand",

    position: [
      -5.264779318620633,
      2.95595630164014,
      3.657288477808505
    ],

    pointDirection: [
      -24.623942345336694,
      9.610056516547152,
      -30.703606500347416
    ],

    ypr: [
      -55.30651046613772,
      65.0935087016437,
      3.0406562776489445
    ]
  },

  {
    endpoint_id: "head",

    position: [
      0,
      0,
      11.172677005051053
    ],

    pointDirection: [
      -42.20646658517987,
      -38.57325135991825,
      3.6776089964001977
    ],

    ypr: [
      -46.153116071995996,
      -3.9450089666957187,
      -21.09974424559286
    ]
  }

];


// =============================================================
// INITIALIZE
// =============================================================

applyPose(servoStatus);

showEndpoints(endpointStatus);


// =============================================================
// DEBUG
// =============================================================

window.applyPose = applyPose;
window.showEndpoints = showEndpoints;

</script>

</body>
</html>
